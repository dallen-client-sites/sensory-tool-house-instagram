name: Refresh Instagram Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest posts
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_LIMIT: '8'
        run: |
          cd scripts
          node fetch-instagram.js

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/instagram-feed.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram-feed.json
          git commit -m "chore: refresh Instagram feed [skip ci]"
          git push
